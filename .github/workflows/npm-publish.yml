name: npm-publish

# Auto-publish to npm on tag push (v0.9.1+).
#
# Actions here are SHA-pinned: the publish job has `id-token: write`, which npm
# trusted publishing exchanges for a publish credential, so a repointed
# upstream tag in any of its steps would run attacker code in a job that can
# publish under this package's name and mint its provenance attestation.
# Update procedure + the gate live in ci.yml's header (audit R11-33).
#
# Trigger: any tag matching `v*.*.*` pushed to origin. The atomic ship
# workflow (commit + push main + git tag + git push tag + gh release create)
# fires this action on the `git push origin v<X.Y.Z>` step. Manual `gh release`
# creation also pushes the tag, so this works for both paths.
#
# Publishing uses npm trusted publishing (OIDC); no npm token is stored.
#   npmjs.com → claudemd-cli → Settings → Trusted publishing → GitHub Actions:
#   organization or user `sdsrss`, repository `claudemd`, workflow filename
#   `npm-publish.yml`, environment empty (the publish job sets none), and
#   allowed actions including `npm publish` (a publisher created after
#   2026-09-03 allows only `npm stage publish` unless that box is ticked).
#   Requires npm >= 11.5.1 and Node >= 22.14.0 in the publish job (Node 24
#   below; Node 20 and 22 bundle npm 10), a GitHub-hosted runner, and the
#   publish job's `id-token: write`. npm tries OIDC first and falls back to a
#   token in the environment when the exchange fails, logging that only in
#   verbose output: with a token the package accepted, a broken trust
#   configuration would still publish and the job would stay green. The
#   package refuses tokens (0.117.2's token publish got E403), and the
#   placeholder NODE_AUTH_TOKEN setup-node v6.5.0 sets is not one npm can
#   publish with, so a failed exchange fails the publish step: on a 401, 403
#   or 404 check the five settings above and the job's permissions; do not
#   add a token back.
#
# Pre-publish gate (0.123.0): the tagged commit must already carry a green
# `ci` run triggered by a pull request. The release flow builds every release
# as a pull request from a `release/vX.Y.Z` branch cut from `next-release`, and
# `ci.yml` runs the full gate there
# (static + three test legs: ubuntu node 20 with the real bash 3.2 checks,
# ubuntu node 24, macOS node 24); GitHub attaches that run to the PR's head
# commit, which is the commit `main` fast-forwards to and the tag names. Until
# 0.122.1 this workflow re-ran static and four test legs on that same commit,
# and `ci.yml` ran a third copy on the main push: three full runs per release
# for one tree. A tag on a commit no pull request tested is refused below.
#
# Idempotency: if NPM has already received this version, `npm publish` exits
# non-zero with E_PUBLISH_ALREADY_PUBLISHED. The job fails loudly rather than
# silently re-publishing — operator's signal that the tag was bumped without
# a corresponding package.json bump.
#
# Manual trigger, for recovering from a transient registry outage when the tag
# already exists: `gh workflow run npm-publish.yml --ref v<X.Y.Z>`. The `--ref`
# is not optional — the guard below compares `GITHUB_REF_NAME` against
# package.json, so a dispatch from `main` computes tag `main`, fails that
# comparison and publishes nothing. There are no workflow_dispatch inputs; the
# ref IS the version selector.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# One publish attempt per tag at a time, and never cancelled mid-flight: a
# cancelled run between `npm publish` and its completion is the one case where
# re-running is not free. ci.yml cancels; this does not (audit-2026-08-22
# 条目 19).
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

# `id-token: write` is granted to the publish job only (below): with npm
# trusted publishing it is the publish credential.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm exchanges this job's OIDC token for a short-lived publish credential
    # (trusted publishing) and signs the provenance attestation with it.
    # `actions: read` lets the ci-gate step list this commit's workflow runs.
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history: the main-ancestry guard below needs origin/main and
          # the tagged commit in the same object store.
          fetch-depth: 0

      # Node 24, not 20: trusted publishing needs npm >= 11.5.1 and Node >=
      # 22.14.0, and Node 20 and 22 bundle npm 10.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify the tagged commit is on main
        # Any branch's `v*.*.*` tag published (Round-14 audit REL-M5). The repo
        # does carry rulesets since 2026-09-07, but they are ref-integrity only
        # (no-delete / no-force on the default branch and on `refs/tags/v*`) and
        # deliberately require no status check — docs/ROLLBACK.md says why — so
        # this is still the only place the invariant can be stated. A tag can no
        # longer be repointed at an unmerged commit after this check passes,
        # which is new; nothing else about the check changes.
        # Ancestry, not equality: the atomic ship flow pushes main and then the
        # tag, and a later commit on main must not invalidate an in-flight
        # publish.
        #
        # `--depth=0` is NOT "no depth limit" — git rejects it during argument
        # parsing (`fatal: depth 0 is not a positive number`, exit 128), and
        # under the `set -eu` above that aborted the step, failed this job, and
        # meant `npm publish` never ran. An explicit refspec instead, so the
        # remote-tracking ref the next line reads is the one being updated;
        # tests/scripts/workflow-step-exec.test.js executes this body.
        run: |
          set -eu
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_SHA is reachable from origin/main"
          else
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on origin/main — refusing to publish a tag from an unmerged branch"
            exit 1
          fi

      - name: Verify package.json version matches the tag
        # Belt-and-suspenders: refuse to publish if the tag and package.json
        # disagree. Catches "tagged v0.9.1 but forgot to bump package.json"
        # which would otherwise publish a misleading version to npm.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [[ "$tag" != "$pkg" ]]; then
            echo "::error::tag $GITHUB_REF_NAME ≠ package.json version $pkg — refusing to publish"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json version $pkg"

      - name: Verify the commit passed ci as a pull request
        # The gate that replaced this workflow's own test jobs (see the
        # header). `head_sha` of a pull_request run is the PR's head commit,
        # which is GITHUB_SHA here when main was fast-forwarded to it.
        # tests/scripts/workflow-step-exec.test.js executes this body.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=pull_request&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "ci")] | length')
          if [ "${n:-0}" -ge 1 ]; then
            echo "OK: $GITHUB_SHA has a green ci run from a pull request"
          else
            echo "::error::no green pull_request ci run on $GITHUB_SHA — release it through a release/vX.Y.Z pull request, or re-run that pull request's ci"
            exit 1
          fi

      - name: Publish to npm
        # The dist-tag is DERIVED from the version, never defaulted (round-17
        # REL-M4). This workflow triggers on `v*.*.*`, which `v1.0.0-rc.1`
        # satisfies, and `npm publish` with no `--tag` writes `dist-tags.latest`
        # — the tag a cold `npx claudemd-cli` resolves. That CLI is the standalone
        # lint entry point for pre-commit hooks and CI; the plugin's own quick start
        # is two slash commands resolving from marketplace git refs, which read no
        # npm dist-tag at all. So the first prerelease ever tagged would have become
        # what every `npx` user gets, with nothing in the tree to stop it.
        #
        # Reading package.json rather than parsing GITHUB_REF_NAME: the step
        # above has already refused to continue unless the two agree, so this is
        # the same value with one less parser. Build metadata is stripped BEFORE the
        # match, not merely excluded by it: semver lets a build identifier contain a
        # hyphen, so `1.2.3+build-9` carries no prerelease and a `*-*` test over the
        # whole string would ship a release to `next`. After the strip, a `-` is the
        # prerelease separator.
        #
        # No npm token in the environment (setup-node sets a placeholder
        # NODE_AUTH_TOKEN, which npm cannot publish with): npm authenticates
        # through trusted publishing (see the header), and `--provenance` is
        # generated either way. tests/scripts/actions-sha-pin.test.js keeps
        # npm tokens out of every workflow line that is not a full-line comment.
        # tests/scripts/workflow-step-exec.test.js executes this body.
        run: |
          set -eu
          pkg=$(node -p "require('./package.json').version")
          case "${pkg%%+*}" in
            *-*) dist_tag=next ;;
            *)   dist_tag=latest ;;
          esac
          echo "publishing $pkg to dist-tag $dist_tag"
          npm publish --provenance --access public --tag "$dist_tag"
