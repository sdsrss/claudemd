name: npm-publish

# Auto-publish to npm on tag push (v0.9.1+).
#
# Actions here are SHA-pinned: this workflow holds NPM_TOKEN and `id-token:
# write`, so a repointed upstream tag in any step would run attacker code in a
# job that can mint a provenance attestation and publish under this package's
# name. Update procedure + the gate live in ci.yml's header (audit R11-33).
#
# Trigger: any tag matching `v*.*.*` pushed to origin. The atomic ship
# workflow (commit + push main + git tag + git push tag + gh release create)
# fires this action on the `git push origin v<X.Y.Z>` step. Manual `gh release`
# creation also pushes the tag, so this works for both paths.
#
# Required repo secret: NPM_TOKEN
#   Type: "Automation" token (npm dashboard → Access Tokens → Generate New Token).
#   Permissions: publish for the `claudemd-cli` package (granular token scope).
#   Lifetime: rotate on a schedule consistent with org policy.
#
# Pre-publish gate: `publish` needs BOTH the `static` job and every leg of the
# `test` matrix — three Linux node legs plus one macOS leg (Round-14 audit
# REL-H2/M5; the header below described a narrower gate than the file now
# declares, in the same commit that widened it). node 20 is the engines floor (node:sqlite absent — exercises
# the degradation path); node 22 has node:sqlite, so it is the only leg that
# runs the real cross-layer SQL query. Gating on node 20 alone (through v0.57.0)
# left that query invisible to the publish gate while ci.yml — which does run it
# — has no `needs:` relationship to this workflow and can still be executing, or
# already red, when the tarball reaches npm (2026-07-25 audit).
# node 24 joined for audit-2026-08-22 条目 10: it bundles npm 12, and npm 12 is
# what surfaced the `npm pack --json` array→object change (F-npm12) — whose
# regression test then ran only under npm 10/11 in this gate. A publish gate
# that never executes the maintainer's own runtime is the shape that let that
# through, and it is the runtime `engines: >=20` invites users onto.
# ONE macOS leg is in, on node 24. macOS is the whole reason the bash-3.2 gates
# exist — /bin/bash there is 3.2 — and it was the leg red on v0.73.0, v0.74.0 and
# v0.75.0, all three of which published anyway. One leg rather than three: macOS
# runners are ~4x slower at process creation and this gate blocks a release.
#
# fetch-depth: 0 — tests/integration/upgrade-lifecycle.test.sh needs tag v0.2.3
# reachable; under the previous shallow checkout it loud-skipped, so the publish
# gate was silently running a smaller suite than CI.
#
# Idempotency: if NPM has already received this version, `npm publish` exits
# non-zero with E_PUBLISH_ALREADY_PUBLISHED. The job fails loudly rather than
# silently re-publishing — operator's signal that the tag was bumped without
# a corresponding package.json bump.
#
# Manual trigger, for recovering from a transient registry outage when the tag
# already exists: `gh workflow run npm-publish.yml --ref v<X.Y.Z>`. The `--ref`
# is not optional — the guard below compares `GITHUB_REF_NAME` against
# package.json, so a dispatch from `main` computes tag `main`, fails that
# comparison and publishes nothing. There are no workflow_dispatch inputs; the
# ref IS the version selector.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# One publish attempt per tag at a time, and never cancelled mid-flight: a
# cancelled run between `npm publish` and its completion is the one case where
# re-running is not free. ci.yml cancels; this does not (audit-2026-08-22
# 条目 19).
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # required for npm provenance attestation (--provenance)

jobs:
  # Mirrors ci.yml's `static` job, and exists because this gate did not run it
  # (Round-14 audit REL-M5). eslint, prettier and the real-tree metrics
  # assertions — including `cycles.count === 0`, which ARCHITECTURE.md cites —
  # were reachable only from ci.yml, and the two workflows have no `needs:` or
  # `workflow_run` relationship, so ci.yml can still be executing, or already
  # red, when the tarball reaches npm. That is not hypothetical: the tags for
  # v0.73.0 / v0.74.0 / v0.75.0 all published while their `ci` run was red.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: eslint (blocking)
        run: npm run lint:js
      - name: prettier (blocking)
        run: npm run format:check
      - name: Real-tree metrics assertions
        env:
          CLAUDEMD_DEVDEPS_REQUIRED: '1'
        run: node --test tests/scripts/baseline-metrics.test.js

  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        # One macOS leg in the publish gate (Round-14 audit REL-H2). macOS is
        # the whole reason the bash-3.2 gates exist — /bin/bash there is 3.2 —
        # and it was the leg red on the three tags that published anyway. The
        # matrix stays asymmetric on purpose: macOS runners are ~4x slower at
        # process creation and this gate blocks a publish, so it buys the
        # platform signal at one leg rather than three.
        include:
          - os: macos-latest
            node: 24
      fail-fast: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install jq + shellcheck (test prereqs)
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install jq shellcheck coreutils
            echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          else
            sudo apt-get update -y && sudo apt-get install -y jq shellcheck
          fi

      - name: Run test suite (publish gate)
        run: bash tests/run-all.sh

  publish:
    needs: [test, static]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history: the main-ancestry guard below needs origin/main and
          # the tagged commit in the same object store.
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify the tagged commit is on main
        # Any branch's `v*.*.*` tag published (Round-14 audit REL-M5). The repo
        # does carry rulesets since 2026-09-07, but they are ref-integrity only
        # (no-delete / no-force on the default branch and on `refs/tags/v*`) and
        # deliberately require no status check — docs/ROLLBACK.md says why — so
        # this is still the only place the invariant can be stated. A tag can no
        # longer be repointed at an unmerged commit after this check passes,
        # which is new; nothing else about the check changes.
        # Ancestry, not equality: the
        # atomic ship flow pushes main and then the tag, and a later commit on
        # main must not invalidate an in-flight publish.
        #
        # `--depth=0` is NOT "no depth limit" — git rejects it during argument
        # parsing (`fatal: depth 0 is not a positive number`, exit 128), and
        # under the `set -eu` above that aborted the step, failed this job, and
        # meant `npm publish` never ran. An explicit refspec instead, so the
        # remote-tracking ref the next line reads is the one being updated;
        # tests/scripts/workflow-step-exec.test.js executes this body.
        run: |
          set -eu
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_SHA is reachable from origin/main"
          else
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on origin/main — refusing to publish a tag from an unmerged branch"
            exit 1
          fi

      - name: Verify package.json version matches the tag
        # Belt-and-suspenders: refuse to publish if the tag and package.json
        # disagree. Catches "tagged v0.9.1 but forgot to bump package.json"
        # which would otherwise publish a misleading version to npm.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [[ "$tag" != "$pkg" ]]; then
            echo "::error::tag $GITHUB_REF_NAME ≠ package.json version $pkg — refusing to publish"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json version $pkg"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
