name: ci

# Third-party actions are pinned to a full commit SHA, with the release they
# were pinned at in a trailing comment (2026-09-02 audit R11-33). `@v6` is a
# pointer the upstream owner can repoint at any commit; npm-publish.yml runs
# with `id-token: write` and NPM_TOKEN in scope, so that pointer is a publish
# credential. tests/scripts/actions-sha-pin.test.js enforces both halves.
#
# To update one: `git ls-remote --tags https://github.com/<owner>/<repo> 'vN*'`,
# take the SHA of the release you want (cross-check it against
# `https://api.github.com/repos/<owner>/<repo>/commits/<tag>` — a `refs/tags/x`
# line is the TAG object's SHA when the tag is annotated, which is not what
# `uses:` wants), then edit both the SHA and its comment.
#
# Tag pushes run the full matrix too (v0.50.0). The marketplace channel
# serves the git tag/release directly, but only the npm channel had a
# tag-time test gate (npm-publish.yml, Linux-only). Without this trigger a
# red-at-tag-time release reached marketplace consumers with no check status
# on the tagged commit. The atomic ship flow (push main + push tag) runs the
# matrix twice on the same commit — accepted cost for channel parity.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

# The atomic ship flow pushes main and then the tag, so the SAME commit enters
# this workflow twice and the full 6-leg matrix ran twice for every release —
# measured on c4ec550: three runs, 14 legs, for one commit. Grouping by ref
# keeps the main-push run and the tag run distinct (they are different refs and
# the tag run is the one that appears on the release), while a superseding push
# to the same ref cancels the run it superseded. Cancelling here is safe: this
# workflow only reports, it publishes nothing — npm-publish.yml gates that and
# deliberately does NOT cancel (audit-2026-08-22 条目 19).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The only job that installs devDependencies. It exists because eslint and
  # prettier had no enforcement point at all: `npm run lint` exited 1 on a clean
  # checkout (30 eslint errors) and `format:check` (99 unformatted files) was
  # referenced by nothing, while CONTRIBUTING.md sent contributors at both
  # (2026-09-02 audit R11-18). Both baselines were burned down first — a gate
  # added over a red baseline is red on arrival and gets ignored.
  #
  # Deliberately NOT folded into the matrix job below. That job must keep
  # running with no `npm install`, because "the suite works from a bare
  # checkout" is a repo invariant and installing here would stop testing it.
  # One leg only: eslint and prettier read the same files on every OS and Node
  # version, so a matrix would buy six identical answers.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # 24 = the maintainer's runtime and the npm that wrote the lockfile;
          # `npm ci` is stricter about lockfile shape than `npm install`.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: eslint (blocking)
        run: npm run lint:js
      - name: prettier (blocking)
        run: npm run format:check
      - name: Real-tree metrics assertions (the half CI could never reach)
        # tests/scripts/baseline-metrics.test.js gates its JS import-graph and
        # long-function assertions behind `if (acorn)`. acorn is a
        # devDependency, so on the no-install matrix legs that branch printed
        # SKIP and asserted nothing — including `cycles.count === 0`, which
        # docs/ARCHITECTURE.md cites. This is the one job where acorn IS
        # present, so here the SKIP is a failure rather than a degradation.
        env:
          CLAUDEMD_DEVDEPS_REQUIRED: '1'
        run: node --test tests/scripts/baseline-metrics.test.js

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 20 = engines floor (node:sqlite absent — exercises the degradation
        # path where memory-maintenance self-skips); 22 = node:sqlite present —
        # exercises the real cross-layer query. With only [20] the actual SQL
        # path was CI-invisible: a query/schema regression shipped green while
        # the suite reported the test as skipped (2026-07-17 audit).
        # 24 = the maintainer's actual runtime (2026-08-16 audit PROC-7):
        # engines declares ">=20" open-ended, and npm 12 (bundled with 24)
        # changed `npm pack --json` from array to object — a green matrix
        # that stops at 22 never executes the versions users actually run.
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    env:
      # Single source for the pinned bash-3.2 build: the cache key below and the
      # shell variable in the parse step both read it. They were two hand-copied
      # literals, and the comment claimed a version bump changed the key — it did
      # not, so a bump would have rebuilt correctly but never re-cached, silently
      # recompiling on every run forever (0.70.0 pre-tag review, MEDIUM-1).
      BASH32_VERSION: 3.2.57
      BASH32_SHA256: 3fa9daf85ebf35068f090ce51283ddeeb3c75eb5bc70b1a4a7cb05868bfe06a4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Tags are needed by the spec-bump gate below (git describe).
          # npm-publish.yml sets the same pair for its tag/version guard.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install tools
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install jq shellcheck coreutils
            echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -y && sudo apt-get install -y jq shellcheck
          fi
      - name: Shellcheck (blocking at warning+; info advisory)
        run: |
          # 2026-07-24 audit P2-11: was warn-only (`|| echo`) — a real regression
          # (unquoted expansion in a new hook) could never redden CI. Baseline
          # cleaned same day (env-hygiene shell directive, dead TRIGGER_RE);
          # warning+ now blocks, info-level stays a visible non-blocking report.
          # 2026-07-25 audit L2: scope was 24/53 shell files — the excluded set
          # held a live semantic bug of exactly the class this gate exists for
          # (session-summary.test.sh env-prefix-on-assignment guard that never
          # exported). Tests + integration + run-all + task scripts now gated.
          # 2026-08-29 audit R10-18c: this step used to carry seven hand-written
          # globs, a proper SUBSET of run-all.sh's `git ls-files '*.sh'` — a
          # second scope for one class, which is what
          # feedback_gate_scope_must_cover_its_subject is about. Both callers now
          # read tests/lib/shell-files.sh, which also enforces a floor: an empty
          # argument list makes shellcheck read stdin and exit 0.
          FILES=$(bash tests/lib/shell-files.sh)
          # shellcheck disable=SC2086  # word splitting is the point: one arg per file
          shellcheck --severity=warning $FILES
          # shellcheck disable=SC2086
          shellcheck $FILES \
            || echo "shellcheck info-level notes above (non-blocking)"
      - name: Reject bash 4+ constructs (macOS bash 3.2 portability gate)
        # Single source: tests/lib/bash32-constructs.sh, which tests/run-all.sh
        # also calls (v0.62.2). This block used to be an inline copy scoped to
        # hooks/ only — so v0.62.1's new test suite shipped `mapfile` and the
        # macOS leg went red on a class this gate exists to prevent, while
        # `npm test` had no way to see it. Rationale + scope live in the script.
        run: bash tests/lib/bash32-constructs.sh
      # Cache the BUILT 3.2 binary, keyed on the version this workflow pins.
      # Without it every Linux/node20 run re-fetched a 2.5 MB tarball from
      # ftp.gnu.org and ran configure+make: 1-2 minutes per run, and a mirror
      # outage was a red CI on a step that has nothing to do with the change
      # under test (2026-08-29 audit R10-16). The key is DERIVED from the
      # job-level BASH32_VERSION, so a bump both misses the cache and re-saves.
      - name: Cache bash ${{ env.BASH32_VERSION }} build
        if: runner.os == 'Linux' && matrix.node == 20
        id: bash32-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/claudemd-bash32
          key: bash32-${{ env.BASH32_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Reject constructs bash 3.2 cannot PARSE (real 3.2 syntax check)
        if: runner.os == 'Linux' && matrix.node == 20
        id: bash32
        run: |
          # v0.58.1 — the pattern gate above catches bash-4 SYNTAX it knows to
          # look for; it cannot catch a construct 3.2 fails to PARSE. v0.58.0
          # shipped `VAR=$(cat <<'EOF' … )` in hooks/lib/hook-common.sh: bash
          # 3.2's command-substitution scanner counts parens/quotes inside the
          # heredoc BODY, so the file failed to source and took every hook with
          # it. Linux CI (bash 5) and the macOS leg (Homebrew bash 5 on PATH)
          # were both green; only the macOS runner's /bin/bash surfaced it, at
          # runtime, in the release CI. Parse every hook with a REAL 3.2 built
          # for this job — a `bash -n` under 5.x proves nothing about 3.2.
          set -eu
          # BASH32_VERSION / BASH32_SHA256 come from the job-level env above, so
          # the cache key and this block cannot drift apart.
          #
          # The digest is checked on the MISS path only — on a cache hit the
          # tarball is never fetched, and the sole check is the --version assert
          # below, which a substituted binary would pass. Stated plainly rather
          # than left for the next reader to over-trust the pin
          # (0.70.0 pre-tag review, MEDIUM-2); acceptable here because the cache
          # is scoped to this repo and no fork PR can write it.
          CACHE_DIR="$HOME/.cache/claudemd-bash32"
          B32="$CACHE_DIR/bash-$BASH32_VERSION"
          if [ ! -x "$B32" ]; then
            echo "cache miss — building bash $BASH32_VERSION from source"
            curl -sSL -o /tmp/bash32.tar.gz "https://ftp.gnu.org/gnu/bash/bash-$BASH32_VERSION.tar.gz"
            echo "$BASH32_SHA256  /tmp/bash32.tar.gz" | sha256sum -c -
            tar xzf /tmp/bash32.tar.gz -C /tmp
            cd "/tmp/bash-$BASH32_VERSION"
            ./configure --quiet --without-bash-malloc >/dev/null 2>&1
            make -s -j"$(nproc)" >/dev/null 2>&1
            cd "$GITHUB_WORKSPACE"
            mkdir -p "$CACHE_DIR"
            cp "/tmp/bash-$BASH32_VERSION/bash" "$B32"
          else
            echo "cache hit — reusing the built bash $BASH32_VERSION"
          fi
          # The cached binary must be the version this step believes it is: a
          # restored cache from a different key, or a truncated copy, would
          # otherwise "parse" the tree under whatever it happens to be.
          "$B32" --version | head -1
          "$B32" --version | head -1 | grep -qF "version $BASH32_VERSION" || {
            echo "::error::cached binary is not bash $BASH32_VERSION"; exit 1; }
          # Scope comes from the pattern gate's --list (2026-07-28): this step had
          # its own hand-written glob trio, NARROWER than the gate it backs up, so
          # a construct 3.2 cannot parse living in tests/hooks/ was invisible to the
          # only check that can see it. Two gates, one class, one file set.
          #
          # Assigned, not inlined into the for-list: `for f in $(cmd)` DISCARDS the
          # exit status even under `set -e`, so a --list that failed its own floor
          # would yield an empty list, parse zero files, and print OK. Capturing it
          # lets set -e fire, and the count assertion covers a success-with-empty
          # -output case that set -e cannot see.
          LIST=$(bash tests/lib/bash32-constructs.sh --list)
          N=$(printf '%s\n' "$LIST" | grep -c . || true)
          [ "$N" -ge 40 ] || { echo "::error::--list resolved $N files, refusing to report a green parse over nothing"; exit 1; }
          echo "parsing $N file(s) under a real bash 3.2"
          found=0
          for f in $LIST; do
            if ! "$B32" -n "$f" 2>/tmp/b32err; then
              echo "::error::$f does not parse under bash 3.2:"
              sed 's|^|  |' /tmp/b32err
              found=1
            fi
          done
          [ "$found" = 0 ] || exit 1
          echo "OK: all hook sources parse under a real bash 3.2"
          # Handed to the runtime step below as a step OUTPUT rather than through
          # $GITHUB_ENV: an env export would also reach "Run test suite", whose
          # own bash-3.2 section keys off BASH32_BIN, and the 32 suites would run
          # twice on this leg for nothing. One producer, one named consumer.
          echo "bin=$B32" >> "$GITHUB_OUTPUT"
      - name: Run the hooks under a real bash 3.2 (runtime, not just parse)
        # The step above proves every hook PARSES under 3.2. It cannot prove one
        # RUNS: `declare -g` (bash 4.2), `local -n` (4.3) and `${x@Q}` (4.4)
        # parse cleanly there and fail on the line that executes them, and the
        # pattern gate is a list of constructs someone already thought of.
        # v0.71.0 moved `read -r -d ''`, process substitution and `printf -v` +
        # `${!var}` onto the first-parse path of all four PreToolUse:Bash hooks
        # and its pre-tag review recorded 3.2 runtime as UNVERIFIED — a real 3.2
        # was present in this job and used only to parse. This step drives the
        # fixture suites with that same cached binary on PATH, so the hooks, the
        # suites and the libraries they source all execute under 3.2.
        # Rationale, scope floor and the shim's reach assertion live in the
        # script; CLAUDEMD_BASH32_REQUIRED turns its local-friendly SKIP into a
        # hard failure here, where a missing binary is the defect.
        if: runner.os == 'Linux' && matrix.node == 20
        env:
          BASH32_BIN: ${{ steps.bash32.outputs.bin }}
          CLAUDEMD_BASH32_REQUIRED: '1'
        run: bash tests/lib/bash32-runtime.sh
      - name: Spec edits require a version bump (post-tag drift gate)
        if: runner.os == 'Linux' && matrix.node == 20
        run: |
          # 2026-08-16 audit F2/PROC-2: commit 34f73e4 edited spec/*.md AFTER
          # tag v0.66.0 without a bump — installed ~/.claude then forked from
          # the marketplace clone at the SAME version, and the SessionStart
          # drift banner fired 713 times over 4 days. version-cascade-check
          # cannot see this class (all its checks are intra-tree; the
          # offending commit even satisfied its Sizing check), and no
          # pre-commit layer exists. This gate relates tree state to tag
          # state, which only CI (with tags fetched) can do — it must NOT
          # move into tests/: the suite stays runnable from an npm tarball
          # with no git history.
          set -eu
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            echo "no tag reachable (fork/shallow clone) — skipping"
            exit 0
          fi
          if git diff --quiet "$LAST_TAG"..HEAD -- spec/; then
            echo "OK: spec/ unchanged since $LAST_TAG"
            exit 0
          fi
          PKG_VER="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VER" = "$LAST_TAG" ]; then
            echo "::error::spec/ changed since $LAST_TAG but package.json is still $PKG_VER — a post-tag spec edit without a bump forks installed vs marketplace content at the same version (the v0.66.0 713-banner incident). Bump the version in the same change."
            exit 1
          fi
          echo "OK: spec/ changed and version bumped ($LAST_TAG -> $PKG_VER)"
      - name: Run test suite
        run: bash tests/run-all.sh
